name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,hpo]"

      - name: Run tests
        run: pytest -q

      - name: Run the smoke example
        run: PYTHONPATH=. python examples/smoke.py

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Install and import the wheel
        run: |
          python -m venv /tmp/rigfl-wheel-smoke
          /tmp/rigfl-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/rigfl-wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/rigfl-wheel-smoke/bin/python -c "import rigfl; from rigfl.experiment.registry import REGISTRY"
          /tmp/rigfl-wheel-smoke/bin/rigfl init /tmp/rigfl-wheel-project
          test -f /tmp/rigfl-wheel-project/configs/datasets.yaml
          test -f /tmp/rigfl-wheel-project/experiments/cifar10_run.yaml
          test -f /tmp/rigfl-wheel-project/.gitignore

  configuration-docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,hpo]" "graphroute==0.1.5"

      - name: Check generated configuration reference
        run: |
          python scripts/generate_config_reference.py --check
          pytest -q tests/test_config_docs.py

  biosilo:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install with BioSilo
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,biosilo]"

      - name: Run BioSilo integration tests
        run: pytest -q tests/test_biosilo.py
