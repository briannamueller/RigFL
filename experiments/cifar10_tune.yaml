name: cifar10_fedprox_grid
algorithms: [fedprox]

base:
  experiment:
    dataset: cifar10
    rounds: 100
    eval_gap: 5
    model: fedavg_cnn
  algorithm:
    local_epochs: 1

replicates:
  - {partition_seed: 0, split_seed: 0, experiment_seed: 0}
  - {partition_seed: 1, split_seed: 1, experiment_seed: 1}
  - {partition_seed: 2, split_seed: 2, experiment_seed: 2}

tuning:
  sampler:
    class: optuna.samplers.GridSampler
    options:
      seed: 17
  metric: accuracy
  search_space:
    algorithm.lr:
      type: categorical
      values: [0.001, 0.01, 0.03]
    algorithm.local_epochs:
      type: categorical
      values: [1, 3]
    algorithm.mu:
      type: categorical
      values: [0.001, 0.01, 0.1]
