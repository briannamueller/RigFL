name: cifar10_full_fedavg_cnn_gnn_arch_compare
algorithms: [feddes]

base:
  experiment:
    dataset: cifar10_full_10_clients
    dataset_config: configs/datasets_cifar10_full_10_clients.yaml
    data_dir: data
    model: fedavg_cnn
    rounds: 1
    batch: 32
    eval_gap: 1
    device: cuda
    quiet: true
  algorithm:
    graphroute:
      base:
        lr: 0.0005
        epochs: 100
        oof_folds: 3
      graph:
        k: 5
        pool_calibrate: true
      gnn:
        hidden_dim: 128
        epochs: 500
        patience: 50
    cache_dir: pool_cache/cifar10_full_10_clients_fedavg_cnn

sweep:
  seed: [0, 1, 2]
  algorithm.graphroute.gnn.arch: [gat, hetero_gat]

tuning:
  strategy: grid
  replicate_axis: seed
  parameters: [algorithm.graphroute.gnn.arch]
