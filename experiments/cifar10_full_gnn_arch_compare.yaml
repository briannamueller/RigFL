name: cifar10_full_fedavg_cnn_gnn_arch_compare
algorithms: [feddes]

base:
  experiment:
    dataset: cifar10_full_10_clients
    dataset_config: configs/datasets_cifar10_full_10_clients.yaml
    data_dir: data
    model: fedavg_cnn
    rounds: 1
    batch: 32
    eval_gap: 1
    device: cuda
    quiet: true
  algorithm:
    graphroute:
      base:
        lr: 0.0005
        epochs: 100
        oof_folds: 3
      graph:
        k: 5
        pool_calibrate: true
      gnn:
        hidden_dim: 128
        epochs: 500
        patience: 50
    cache_dir: pool_cache/cifar10_full_10_clients_fedavg_cnn

replicates:
  - {partition_seed: 0, split_seed: 0, experiment_seed: 0}
  - {partition_seed: 1, split_seed: 1, experiment_seed: 1}
  - {partition_seed: 2, split_seed: 2, experiment_seed: 2}

sweep:
  algorithm.graphroute.gnn.arch: [gat, hetero_gat]
