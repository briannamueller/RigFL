name: cifar10_optuna
algorithms: [fedprox]

base:
  experiment:
    dataset: cifar10
    model: fedavg_cnn
    rounds: 100
    eval_gap: 5

replicates:
  - {partition_seed: 0, split_seed: 0, experiment_seed: 0}
  - {partition_seed: 1, split_seed: 1, experiment_seed: 1}
  - {partition_seed: 2, split_seed: 2, experiment_seed: 2}

tuning:
  trials: 100
  sampler:
    class: optuna.samplers.TPESampler
    options:
      seed: 17
  metric: accuracy
  search_space:
    algorithm.lr:
      type: float
      low: 0.0001
      high: 0.1
      log: true
    algorithm.local_epochs:
      type: int
      low: 1
      high: 5
    algorithm.mu:
      type: float
      low: 0.0001
      high: 1.0
      log: true
    experiment.batch:
      type: categorical
      values: [32, 64, 128]
