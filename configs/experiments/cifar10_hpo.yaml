# Demonstration-scale Optuna study, not a scientific search recommendation.
name: cifar10_hpo
algorithms: [fedprox]

base:
  experiment:
    dataset: cifar10
    model: fedavg_cnn
    rounds: 2
    shared_dim: 128
    eval_gap: 1
    device: cpu
    out_dir: results
  algorithm:
    local_epochs: 1

replicates:
  - {partition_seed: 0, split_seed: 0, experiment_seed: 0}
  - {partition_seed: 0, split_seed: 0, experiment_seed: 1}

tuning:
  trials: 4
  sampler:
    class: optuna.samplers.TPESampler
    options:
      seed: 17
  metric: accuracy
  search_space:
    algorithm.lr:
      type: float
      low: 0.001
      high: 0.1
      log: true
    algorithm.mu:
      type: float
      low: 0.001
      high: 0.1
      log: true
