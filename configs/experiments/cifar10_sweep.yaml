# Demonstration-scale matched Local/FedAvg runs, not scientific defaults.
name: cifar10_sweep
algorithms: [local, fedavg]

base:
  experiment:
    dataset: cifar10
    model: fedavg_cnn
    rounds: 2
    shared_dim: 128
    eval_gap: 1
    device: cpu
    out_dir: results
  algorithm:
    local_epochs: 1
    lr: 0.01

replicates:
  - {partition_seed: 0, split_seed: 0, experiment_seed: 0}
  - {partition_seed: 0, split_seed: 0, experiment_seed: 1}
  - {partition_seed: 0, split_seed: 0, experiment_seed: 2}
